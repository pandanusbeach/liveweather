<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pandanus Smart Kiosk - Fast Update</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; cursor: none; }
        
        body {
            color: white; height: 100vh; width: 100vw; overflow: hidden;
            display: flex; flex-direction: column; align-items: center; text-align: center;
            background-color: #0c1c4e;
            padding: 50px 0;
        }

        .header { width: 100%; margin-bottom: 20px; }
        .hotel-name { font-size: 3rem; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; }
        .location { font-size: 1.6rem; opacity: 0.7; font-weight: 300; margin-top: 5px; }

        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }

        .icon-box {
            font-size: 11rem;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.3));
            animation: float 4s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .temp-main {
            font-size: 13rem;
            font-weight: 900;
            line-height: 0.9;
            margin: 20px 0;
            text-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }

        .desc { font-size: 3.2rem; font-weight: 700; margin-bottom: 10px; }
        .temp-actual { font-size: 1.8rem; opacity: 0.6; margin-bottom: 40px; }

        .advice-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            width: 80%;
            padding: 35px;
            border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .adv-text { font-size: 2.1rem; font-weight: 500; line-height: 1.5; }

        .kiosk-footer { width: 100%; margin-top: 30px; }
        #clock { font-size: 6rem; font-weight: 800; letter-spacing: -2px; }
        #date { font-size: 1.7rem; opacity: 0.7; text-transform: uppercase; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="hotel-name">PANDANUS BEACH Resort & Spa</div>
        <div class="location">Induruwa • Sri Lanka</div>
    </div>

    <div class="main-content">
        <div class="icon-box" id="icon">☀️</div>
        <div style="font-size: 1.6rem; letter-spacing: 5px; opacity: 0.6; text-transform: uppercase;">Feels Like</div>
        <div class="temp-main" id="realFeel">--°C</div>
        <div id="description" class="desc">Syncing...</div>
        <div class="temp-actual" id="actualTemp">Actual: --°C</div>

        <div class="advice-card">
            <div class="adv-text" id="kioskAdvice">Welcome to Pandanus Beach Resort</div>
        </div>
    </div>

    <footer class="kiosk-footer">
        <div id="clock">00:00:00</div>
        <div id="date">--</div>
    </footer>

    <script>
        const LAT = 6.4025;
        const LON = 80.0033;

        async function fetchWeather() {
            try {
                const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current_weather=true&hourly=apparent_temperature&timezone=auto`);
                const data = await response.json();

                const cur = data.current_weather;
                const hour = new Date().getHours();
                const realFeel = Math.round(data.hourly.apparent_temperature[hour]);
                const isDay = cur.is_day === 1;
                const code = cur.weathercode;

                // Update UI Elements
                document.getElementById('realFeel').innerText = `${realFeel}°C`;
                document.getElementById('actualTemp').innerText = `Actual Temperature: ${Math.round(cur.temperature)}°C`;

                // Logic for Icon/Description
                let icon = isDay ? '☀️' : '🌙'; 
                let desc = 'Clear Skies';

                if (code >= 1 && code <= 3) { icon = isDay ? '⛅' : '☁️'; desc = 'Partly Cloudy'; }
                else if (code >= 51) { icon = '🌧️'; desc = 'Rainy Conditions'; }

                document.getElementById('icon').innerText = icon;
                document.getElementById('description').innerText = desc;

                // Update Advice
                const adviceEl = document.getElementById('kioskAdvice');
                if (!isDay) {
                    adviceEl.innerText = "Enjoy the calm ocean breeze and our evening hospitality.";
                } else if (realFeel >= 35) {
                    adviceEl.innerText = "It's a warm day! Stay hydrated and enjoy our chilled refreshments.";
                } else {
                    adviceEl.innerText = "A beautiful tropical day! Perfect for a beach walk or a swim.";
                }

            } catch (error) {
                console.log("Weather fetch failed, will retry...");
            }
        }

        function updateTime() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('en-US', { hour12: true, hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('date').innerText = now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }).toUpperCase();
        }

        // Initial Calls
        updateTime();
        fetchWeather();

        // Intervals
        setInterval(updateTime, 1000); // Clock: 1 sec
        setInterval(fetchWeather, 120000); // Weather: 2 mins (Fast update)
    </script>
</body>
</html>
